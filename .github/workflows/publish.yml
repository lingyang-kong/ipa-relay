name: Publish source

env:
  APP_IDS: |
    1116555378

on:
  schedule:
    - cron: '17 0 * * 1'
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  catalog:
    runs-on: ubuntu-slim
    permissions:
      contents: read
      pages: read
    outputs:
      build: ${{ steps.check.outputs.build }}
      listings: ${{ steps.check.outputs.listings }}
      base_url: ${{ steps.pages.outputs.base_url }}
    steps:
      - uses: actions/configure-pages@main
        id: pages
        background: true
      - uses: actions/checkout@main
        with:
          persist-credentials: false
      - name: Read storefront ID
        id: storefront
        env:
          APPLE_STORE_CONTEXT_B64: ${{ secrets.APPLE_STORE_CONTEXT_B64 }}
        run: |
          storefront_id=$(printf '%s' "${APPLE_STORE_CONTEXT_B64:?Set the APPLE_STORE_CONTEXT_B64 secret}" |
            base64 --decode | gzip -dc | jq -ers -f scripts/storefront.jq)
          printf 'id=%s\n' "$storefront_id" >>"$GITHUB_OUTPUT"
      - wait: pages
      - name: Check storefront listings
        id: check
        env:
          PAGE_URL: ${{ steps.pages.outputs.base_url }}
          EVENT_NAME: ${{ github.event_name }}
          STOREFRONT_ID: ${{ steps.storefront.outputs.id }}
        run: |
          if [ "$EVENT_NAME" = schedule ]; then
            export PUBLISHED_SOURCE_URL="${PAGE_URL%/}/source.json"
          fi
          listings="$RUNNER_TEMP/listings.jsonl"
          build=$(printf '%s' "$APP_IDS" | bash scripts/catalog.sh "$PAGE_URL" /dev/stdin "$listings" "$STOREFRONT_ID")
          echo "build=$build" >>"$GITHUB_OUTPUT"
          if [ "$build" = true ]; then
            {
              echo 'listings<<END_LISTINGS'
              cat "$listings"
              echo 'END_LISTINGS'
            } >>"$GITHUB_OUTPUT"
          fi

  build:
    needs: catalog
    if: needs.catalog.outputs.build == 'true'
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - name: Install UnfairPlay release
        id: unfairplay
        background: true
        working-directory: ${{ runner.temp }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir unfairplay-release
          cd unfairplay-release
          gh release download --repo DrWhax/unfairplay \
            --pattern 'unfairplay-*-darwin-arm64.tar.gz' --pattern SHA256SUMS
          shopt -s nullglob
          archives=(unfairplay-*-darwin-arm64.tar.gz)
          if ((${#archives[@]} != 1)); then
            echo 'Expected one macOS arm64 UnfairPlay release archive.' >&2
            exit 1
          fi
          archive=${archives[0]}
          release=${archive%.tar.gz}
          awk -v archive="$archive" '$2 == archive || $2 == "./" archive { print; count++ } END { exit count != 1 }' \
            SHA256SUMS > selected-checksum.txt
          shasum -a 256 --check selected-checksum.txt
          tar -xzf "$archive" "$release/unfairplay"
          "$PWD/$release/unfairplay" --version
          echo "$PWD/$release" >>"$GITHUB_PATH"
      - uses: actions/checkout@main
        with:
          persist-credentials: false
      - name: Build App Store downloader
        env:
          GH_TOKEN: ${{ github.token }}
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          if ! command -v go >/dev/null; then
            brew install go
          fi
          bash scripts/build-store.sh "$RUNNER_TEMP/store"
          echo "$RUNNER_TEMP/store" >>"$GITHUB_PATH"
      - wait: unfairplay
      - name: Build IPAs and source index
        env:
          PAGE_URL: ${{ needs.catalog.outputs.base_url }}
          LISTINGS: ${{ needs.catalog.outputs.listings }}
          APPLE_STORE_CONTEXT_B64: ${{ secrets.APPLE_STORE_CONTEXT_B64 }}
          UNFAIRPLAY_MODEL_B64: ${{ secrets.UNFAIRPLAY_MODEL_B64 }}
        run: |
          : "${LISTINGS:?Missing checked storefront listings}"
          umask 077
          private_dir=$(mktemp -d "$RUNNER_TEMP/store.XXXXXXXX")
          trap 'rm -rf "$private_dir"' EXIT
          export APPLE_STORE_CONTEXT_FILE="$private_dir/context.json"
          export UNFAIRPLAY_MODEL_FILE="$private_dir/fairplay-enrollment.bin"
          printf '%s' "${APPLE_STORE_CONTEXT_B64:?Set the APPLE_STORE_CONTEXT_B64 secret}" | base64 -D | gzip -dc >"$APPLE_STORE_CONTEXT_FILE"
          printf '%s' "${UNFAIRPLAY_MODEL_B64:?Set the UNFAIRPLAY_MODEL_B64 secret}" | base64 -D >"$UNFAIRPLAY_MODEL_FILE"
          unset APPLE_STORE_CONTEXT_B64 UNFAIRPLAY_MODEL_B64
          umask 022
          LISTINGS_FILE=/dev/stdin bash scripts/publish.sh "$PAGE_URL" "$RUNNER_TEMP/site" <<<"$LISTINGS"
      - uses: actions/upload-pages-artifact@main
        with:
          path: ${{ runner.temp }}/site

  deploy:
    needs: build
    runs-on: ubuntu-slim
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@main
        id: deployment
